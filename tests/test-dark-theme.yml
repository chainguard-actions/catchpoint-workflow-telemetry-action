name: Test with dark theme and custom metric frequency
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          theme: "dark"
          metric_frequency: "10"
          job_summary: "true"
          comment_on_pr: "false"
      - name: Assert action completed with dark theme
        run: |
          echo "Action completed with theme=dark and metric_frequency=10"
          echo "PASS: action ran without error with dark theme settings"
