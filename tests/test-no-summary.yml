name: Test with job summary and PR comment disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          job_summary: "false"
          comment_on_pr: "false"
      - name: Assert action completed without posting summary
        run: |
          echo "Action completed with job_summary=false and comment_on_pr=false"
          echo "PASS: action ran without error in silent mode"
