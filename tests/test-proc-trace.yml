name: Test process tracing options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          metric_frequency: 10
          proc_trace_min_duration: 100
          proc_trace_sys_enable: "true"
          proc_trace_chart_show: "true"
          proc_trace_chart_max_count: 50
          proc_trace_table_show: "true"
          comment_on_pr: "false"
          job_summary: "true"
      - name: Assert action ran with process tracing options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with process tracing options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
